---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: he-codeco-acm
  labels:
    app.kubernetes.io/name: node-exporter
  annotations:
      prometheus.io/scrape: 'true'
      prometheus.io/port:   '9100'
spec:
  selector:
      app.kubernetes.io/name: node-exporter
  ports:
  - name: node-exporter
    protocol: TCP
    port: 9100
    targetPort: http-metrics
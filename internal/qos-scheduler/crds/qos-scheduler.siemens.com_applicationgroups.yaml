---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: applicationgroups.qos-scheduler.siemens.com
spec:
  group: qos-scheduler.siemens.com
  names:
    kind: ApplicationGroup
    listKind: ApplicationGroupList
    plural: applicationgroups
    shortNames:
    - ag
    singular: applicationgroup
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Application group status
      jsonPath: .status.phase
      name: Status
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ApplicationGroup is a collection of Applications that should be
          scheduled together.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ApplicationGroupSpec describes an application group.
              Members of an application group are identified by having a label
              application-group with value equal to this group's name.
            properties:
              minMember:
                default: 1
                description: |-
                  MinMember says how many applications matching the label query
                  need to be either running or waiting in order for scheduling
                  to begin. The default is 1.
                format: int32
                type: integer
            type: object
          status:
            description: ApplicationGroupStatus defines the observed state of ApplicationGroup
            properties:
              lastUpdateTime:
                format: date-time
                type: string
              phase:
                type: string
              solverAttemptCount:
                type: integer
            required:
            - solverAttemptCount
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

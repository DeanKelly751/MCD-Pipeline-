---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: networkendpoints.qos-scheduler.siemens.com
spec:
  group: qos-scheduler.siemens.com
  names:
    kind: NetworkEndpoint
    listKind: NetworkEndpointList
    plural: networkendpoints
    singular: networkendpoint
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: NetworkEndpoint is the schema for NetworkEndpoints.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NetworkEndpointSpec is additional information about a ComputeNode.
            properties:
              mappedNetworkInterfaces:
                additionalProperties:
                  type: string
                description: |-
                  MappedNetworkInterfaces map network implementation (network type) labels to network interface names.
                  There needs to be an entry in this map for every physical network that
                  this endpoint participates in.
                  For Kubernetes nodes, the network operators for physical networks are responsible
                  for inserting an entry for their network in this mapping.
                type: object
              networkInterfaces:
                description: |-
                  NetworkInterfaces are all the network interfaces on the endpoint.
                  For Kubernetes nodes, this list is populated by the node daemon set.
                items:
                  properties:
                    alternateAddresses:
                      description: |-
                        If the network interface has other addresses, record them here.
                        This is relevant for node network interfaces that have multiple
                        addresses.
                      items:
                        type: string
                      type: array
                    ipv4Address:
                      description: |-
                        The ip v4 address associated with this network interface.
                        Only interfaces with an ip address are relevant to us, so
                        this field is mandatory.
                      type: string
                    macAddress:
                      description: The mac address associated with this network interface.
                      type: string
                    name:
                      description: The name of a network interface, such as eth0
                      type: string
                  required:
                  - ipv4Address
                  - name
                  type: object
                type: array
              nodeName:
                description: |-
                  NodeName is the name of the corresponding Kubernetes node, if such a node exists.
                  Otherwise, a unique name.
                type: string
            required:
            - networkInterfaces
            - nodeName
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

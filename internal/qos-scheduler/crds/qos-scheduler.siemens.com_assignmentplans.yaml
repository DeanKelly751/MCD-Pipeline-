                              items:
                                type: string
                              type: array
                            latency:
                              description: NETWORK
                              format: int64
                              type: integer
                            memory:
                              properties:
                                capacity:
                                  format: int64
                                  type: integer
                                used:
                                  format: int64
                                  type: integer
                              type: object
                            node_type:

                                        type: integer
                                      used:
                                        format: int64
                                        type: integer
                                    type: object
                                  id:
                                    type: string
                                type: object
                              type: array
                            paths:
                              items:
                                description: |-
                                  Path between two compute nodes.  It has no cycles.
                                  A path’s attributes are derived from its constituent links.
                                properties:
                                  id:
                                    type: string
                                  links:
                                    items:
                                      type: string
                                    type: array
                                type: object
                              type: array
                            qos:
                              format: int32
                              type: integer

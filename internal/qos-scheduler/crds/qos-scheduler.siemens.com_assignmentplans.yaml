                              items:
                                description: There is at most one link in a network
                                  between any pair of nodes.
                                properties:
                                  id:
                                    type: string
                                  latency:
                                    format: int64
                                    type: integer
                                  medium:
                                    type: string
                                  source:
                                    type: string
                                  target:
                                    type: string
                                type: object
                              type: array
                            media:
                              items:
                                description: Transport medium (e.g., a WLAN channel

                            target_port:
                              format: int32
                              type: integer
                            target_workload:
                              type: string
                          type: object
                        type: array
                    type: object
                  costs:
                    description: Node-specific costs for workloads
                    properties:
                      nodes:
                        items:
                          properties:
                            node:
                              type: string
                            value:
                              type: number
                          type: object
                        type: array
                      workloads:
                        items:
                          properties:
                            application:
                              type: string
                            nodes:
                              items:
                                properties:
                                  node:
                                    type: string
                                  value:
                                    type: number
                                type: object
                              type: array
                            workload:
                              type: string
                          type: object
                        type: array
                    type: object
                  infrastructure:
                    properties:
                      networks:
                        items:
                          properties:
                            bearer:
                              type: string
                            id:
                              type: string

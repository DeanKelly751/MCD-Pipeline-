          status:
            description: AssignmentPlanStatus describes the current state of an assignment
              plan.
            properties:
              actionInfo:
                description: list of actions results
                items:
                  properties:
                    done:
                      description: is the corresponding action done?
                      type: boolean
                    error:
                      description: if not empty indicates that there was an error
                      type: string
                  required:
                  - done
                  type: object
                type: array
              actions:
                description: list of actions for assignment
                items:
                  properties:
                    action:
                      description: what is to be done
                      type: integer
                    object:
                      description: name of target object
                      type: string
                    param:
                      description: name of parameter object
                      type: string
                    proto:
                      description: what object is the base of the base new object
                      type: string
                  required:
                  - action
                  - object
                  type: object
                type: array
              clusterNames:
                additionalProperties:
                  properties:
                    location:
                      description: Location of pod or channels (node or path)
                      type: string
                    name:
                      description: Name of pod or channel in cluster
                      type: string
                  required:
                  - location
                  - name
                  type: object
                description: map workload or channel to name of pod or channel in
                  cluster
                type: object
              modelHash:
                description: hash of model fields after model was updated with assignment
                type: string
              phase:
                description: |-
                  One of {"Idle", "Placing", "Scheduling"}.  Indicates whether the plan
                  waits for Solver to finish (Placing) or implements the plan in the
                  cluster (Scheduling).
                type: string
              reply:
                description: Solver’s reply for assignment plan
                properties:
                  assignment:
                    properties:
                      channels:

test-build:
    stage: test-build
    tags:
      - rhat-runner
    image: fedora:latest
    services:
      - name: docker:dind
        command: ["--privileged"]  # Enable privileged mode
    dependencies:
      - build-deployment
    script:
      - echo "Running tests..."
      - import KUBECONFIG=$HOME/.kube/config
      - kubectl config get-contexts
      - make deploy IMG="quay.io/dekelly/codecov21:v0.0.1"
     


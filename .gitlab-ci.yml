stages:          # List of stages for jobs, and their order of execution
  - build
  - push

variables: 
  IMG_NAME: "quay.io/dekelly/codecoapp-acm"
  IMG_TAG: "${CI_COMMIT_SHORT_SHA}"
  DOCKER_DRIVER: overlay2

services:
  - docker:dind


build-job:       # This job runs in the build stage, which runs first.
  stage: build
  image: fedora:latest
  script:
    - echo "Logging into Quay..."
    - podman login quay.io -u $QUAY_USER -p $QUAY_PASS
    - echo "Building image..."
    - make docker-build IMG="$IMG_NAME:$IMG_TAG"
    - echo "Build complete."

push-job:   # This job runs in the push stage.
  stage: push   # It only starts when the job in the build stage completes successfully.
  image: fedora:latest
  script:
    - echo "Pushing image to Quay.io..."
    - make docker-push IMG="$IMG_NAME:$IMG_TAG"

  only:
    - main

stages:
  - build
  - push

variables: 
  DOCKER_DRIVER: overlay2

services:
  - docker:dind

before_script:
  - dnf install -y golang make git dnf-plugins-core
  - dnf config-manager --add-repo=https://download.docker.com/linux/fedora/docker-ce.repo
  - dnf install -y docker-ce-cli
  - go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.10.0 # Adjust the version as needed
  - export PATH=$PATH:$(go env GOPATH)/bin
  - echo "Logging into Quay..."
  - docker login quay.io -u $QUAY_USER -p $QUAY_PASS

build:
  stage: build
  image: fedora:latest
  script:
    - echo "Building image..."
    - make docker-build IMG="quay.io/dekelly/codecoapp-acm:latest"
    - echo "Build complete."

push:
  stage: push
  image: fedora:latest
  script:
    - echo "Pushing image to Quay.io..."
    - make docker-push IMG=""quay.io/dekelly/codecoapp-acm:latest"
  only:
    - main

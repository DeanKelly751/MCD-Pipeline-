stages:
  - build
  - build-cluster
  - test-build
  - test-logs
  - clean-up
  - push

variables: 
  IMG_NAME: "quay.io/dekelly/codecoapp-acm"
  IMG_TAG: "${CI_COMMIT_SHORT_SHA}"
  IMG: "$IMG_NAME:$IMG_TAG"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""  # Disable Docker TLS

  # KUSTOMIZE_VERSION: 5.0.3 # Define the desired kustomize version
  # KUBECONFIG: ~/.kube/config

services:
    - name: docker:dind
      command: ["--privileged"] 

before_script:
  - dnf install -y wget make git dnf-plugins-core
  - dnf config-manager --add-repo=https://download.docker.com/linux/fedora/docker-ce.repo
  - dnf install -y docker-ce-cli
  - wget https://go.dev/dl/go1.21.9.linux-amd64.tar.gz
  - tar -C /usr/local -xzf go1.21.9.linux-amd64.tar.gz
  - export PATH=$PATH:/usr/local/go/bin
  - go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.10.0
  - export PATH=$PATH:$(go env GOPATH)/bin
  - echo "Logging into Quay..."
  - echo "$QUAY_PASS" | docker login quay.io -u "$QUAY_USER" --password-stdin
  - echo "Logging into Docker"
  - docker login -u $DOCK_USER -p $DOCK_PASS

  # - curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
  # - mv ./kustomize /usr/local/bin/kustomize  # Move it to a location in PATH
  # - chmod +x ./scripts/pre_deploy.sh ./scripts/post_deploy.sh


build:
  stage: build
  image: fedora:latest
  services:
    - name: docker:dind
      command: ["--privileged"]  # Enable privileged mode
  script:
    - docker info  # Check Docker connection
    - controller-gen object paths=./api/...  # Generate controller object files
    - docker build -t ${IMG} .  # Build Docker image
    - echo "Build complete."

build-cluster:
  stage: build-cluster
  image: fedora:latest
  services:
    - name: docker:dind
      command: ["--privileged"]  # Enable privileged mode
  script:
    - export PATH=$PATH:/usr/local/go/bin
    - echo "Installing Kind and kubectl..."
    - curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.18.0/kind-linux-amd64
    - chmod +x ./kind
    - mv ./kind /usr/local/bin/kind
    - curl -Lo ./kubectl https://dl.k8s.io/release/v1.24.0/bin/linux/amd64/kubectl
    - chmod +x ./kubectl
    - mv ./kubectl /usr/local/bin/kubectl
    - echo "Creating Kind cluster..."
    - kind create cluster --config ./config/cluster/kind-config.yaml
    - echo "Test cluster created."

test-build:
  stage: test-build
  image: fedora:latest
  services:
    - name: docker:dind
      command: ["--privileged"]  # Enable privileged mode
  script:
    - echo "Running tests..."
    - ./scripts/pre_deploy.sh  # Run pre-deployment script
    # - cd config/manager && kustomize edit set image controller=$IMG  # Set the controller image in the Kustomize file
    # - kustomize build config/default | kubectl apply -f -  # Build and deploy using kubectl
    # - ./scripts/post_deploy.sh 

    # - kubectl create -f codecosampleapp
    # - sleep 60

    # - kubectl get po - - if status = FAILED, get name of pod status FAILED, kubectl describe pod POD_NAME, loop through all status fails

test-logs:
  stage: test-logs
  image: fedora:latest
  services:
    - name: docker:dind
      command: ["--privileged"]
  script:
    - sleep 30
    - kubectl get po -A

clean-up: 
    stage: clean-up
    image: fedora:latest
    services:
      - name: docker:dind
        command: ["--privileged"]  # Enable privileged mode
    script:
      - echo "Deleting cluster ..."
      - kind delete cluster

    

